{% load static %}
<!doctype html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{{ title }} | Jordy Cap</title>
  <link rel="stylesheet" href="{% static 'css/modavibe.css' %}">
  <style>
    body { margin: 0; background: #f7f1e8; color: #1d2725; font-family: Manrope, sans-serif; }
    .edit-page { min-height: 100vh; display: grid; place-items: center; padding: 28px 16px; background: radial-gradient(circle at 12% 0%, #fffaf3 0, #f7f1e8 45%, #eee7dc 100%); }
    .edit-card { width: min(100%, 620px); padding: 34px; border: 1px solid #ded7cc; border-radius: 20px; background: #fffaf3; box-shadow: 0 18px 45px rgba(29,39,37,.1); }
    .edit-logo { width: 140px; height: 52px; object-fit: contain; object-position: left center; }
    .edit-card h1 { margin: 16px 0 8px; color: #1d2725; font-family: 'DM Sans', sans-serif; font-size: clamp(28px, 4vw, 42px); font-style: italic; letter-spacing: -.04em; }
    .edit-card > p { margin: 0 0 26px; color: #69736e; font-size: 13px; }
    .edit-form p { margin: 0 0 14px; }
    .edit-form label { display: block; margin-bottom: 7px; color: #1d2725; font-size: 11px; font-weight: 900; }
    .edit-form input:not([type="checkbox"]), .edit-form select { width: 100%; min-height: 43px; padding: 0 12px; border: 1px solid #ded7cc; border-radius: 9px; outline: 0; background: #fffdf9; color: #1d2725; }
    .edit-form input[type="checkbox"] { accent-color: #f05a47; }
    .edit-form input[type="file"] { padding: 10px; }
    .edit-form input:focus, .edit-form select:focus { border-color: #2351a5; box-shadow: 0 0 0 3px rgba(35,81,165,.1); }
    .edit-actions { display: flex; align-items: center; gap: 16px; margin-top: 22px; }
    .edit-actions button { min-height: 44px; padding: 0 19px; border: 0; border-radius: 999px; background: #f05a47; color: #fffaf3; cursor: pointer; font-size: 11px; font-weight: 900; }
    .edit-actions a { color: #2351a5; font-size: 11px; font-weight: 900; }
    .edit-error { margin: 0 0 16px; color: #f05a47; font-size: 12px; font-weight: 800; }
    @media (max-width: 520px) { .edit-card { padding: 25px 20px; } .edit-actions { align-items: stretch; flex-direction: column; } .edit-actions button { width: 100%; } .edit-actions a { text-align: center; } }
  </style>
</head>
<body>
  <main class="edit-page">
    <section class="edit-card">
      <img class="edit-logo" src="{% static 'media/jordy-cap-logo.png' %}" alt="Jordy Cap">
      <h1>{{ title }}</h1>
      <p>{{ description }}</p>
      {% if form.errors %}<div class="edit-error">Vérifie les informations saisies.</div>{% endif %}
      <form class="edit-form" method="post" enctype="multipart/form-data">
        {% csrf_token %}
        {{ form.as_p }}
        <div class="edit-actions"><button type="submit">{{ submit_label }}</button><a href="{% url 'account:dashboard' %}">Annuler et revenir au dashboard</a></div>
      </form>
    </section>
  </main>
</body>
</html>
