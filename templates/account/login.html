{% load static %}
<!doctype html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Connexion administrateur | Jordy Cap</title>
  <link rel="stylesheet" href="{% static 'css/modavibe.css' %}">
  <style>
    .account-page { min-height: 100vh; display: grid; place-items: center; padding: 24px; background: var(--ivory); }
    .account-card { width: min(100%, 430px); padding: 34px; border: 1px solid var(--line); border-radius: 16px; background: var(--paper); box-shadow: 0 18px 40px rgba(29,39,37,.12); }
    .account-logo { display: block; width: 150px; height: auto; margin: 0 auto 24px; }
    .account-card h1 { margin: 0 0 8px; color: var(--ink); font-family: 'DM Sans', sans-serif; font-size: 29px; font-style: italic; text-align: center; }
    .account-card p { margin: 0 0 26px; color: var(--muted); font-size: 13px; text-align: center; }
    .account-form p { margin: 0 0 16px; text-align: left; }
    .account-form label { display: block; margin-bottom: 7px; color: var(--ink); font-size: 11px; font-weight: 800; }
    .account-form input { width: 100%; min-height: 44px; padding: 0 12px; border: 1px solid var(--line); border-radius: 8px; background: transparent; color: var(--ink); }
    .account-form button { width: 100%; min-height: 48px; margin-top: 6px; border: 0; border-radius: 999px; background: var(--coral); color: var(--paper); cursor: pointer; font-size: 11px; font-weight: 900; letter-spacing: .08em; text-transform: uppercase; }
    .account-error { margin-bottom: 16px; padding: 11px 13px; border-radius: 8px; background: #f5c5a3; color: var(--ink); font-size: 12px; }
    .account-back { display: block; margin-top: 20px; color: var(--cobalt); font-size: 11px; font-weight: 800; text-align: center; }
  </style>
</head>
<body>
  <main class="account-page">
    <section class="account-card" aria-labelledby="login-title">
      <img class="account-logo" src="{% static 'media/jordy-cap-logo.png' %}" alt="Jordy Cap">
      <h1 id="login-title">Connexion admin</h1>
      <p>Accédez à votre espace d’administration.</p>
      {% if form.errors %}
        <div class="account-error">Identifiant ou mot de passe incorrect.</div>
      {% endif %}
      <form class="account-form" method="post">
        {% csrf_token %}
        <input type="hidden" name="next" value="{{ next }}">
        {{ form.as_p }}
        <button type="submit">Se connecter</button>
      </form>
      <a class="account-back" href="{% url 'vente:home' %}">Retour à l’accueil</a>
    </section>
  </main>
</body>
</html>
